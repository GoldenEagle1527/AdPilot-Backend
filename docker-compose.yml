# 只起应用。PostgreSQL / Redis 用本机或服务器上已有的，地址写 deployment/dev.yaml。
services:
  api:
    build:
      context: .
      dockerfile: dockerfile/backend.Dockerfile
    container_name: adpilot-api
    environment:
      ADPILOT_ENV: dev
    ports:
      - "8300:8300"
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/main.py:/app/main.py
      - ./deployment:/app/deployment:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped
