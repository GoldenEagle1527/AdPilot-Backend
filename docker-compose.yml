# 开发栈：只拉 Harbor。112.12 不出现在这里。
services:
  postgres:
    image: 192.168.111.40:88/group-one/postgres:18
    environment:
      POSTGRES_DB: ad_pilot
      POSTGRES_USER: ad_pilot
      POSTGRES_PASSWORD: ad_pilot
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ad_pilot -d ad_pilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: 192.168.111.40:88/group-one/redis:7.2.16
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: dockerfile/backend.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/opt/adpilot/backend
      - ./deployment:/opt/adpilot/deployment:ro

  # 本机 Windows 上 asyncpg 走端口映射常被掐断；测试进同一 Compose 网。
  test:
    build:
      context: .
      dockerfile: dockerfile/backend.Dockerfile
    working_dir: /opt/adpilot/backend
    environment:
      ADPILOT_ENV: dev
      PYTHONPATH: /opt/adpilot/backend
    volumes:
      - ./backend:/opt/adpilot/backend
      - ./deployment:/opt/adpilot/deployment:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["test"]
    command: ["sh", "-c", "alembic upgrade head && python -m unittest discover -s tests -v"]

volumes:
  pgdata:
