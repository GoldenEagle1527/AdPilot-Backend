# 只起应用。Celery Beat / Worker 先停着。PostgreSQL / Redis 用服务器上已有的，地址写 deployment/dev.yaml。
x-adpilot: &adpilot
  build:
    context: .
    dockerfile: dockerfile/backend.Dockerfile
  environment:
    ADPILOT_ENV: dev
  volumes:
    - ./backend/app:/app/app
    - ./deployment:/app/deployment:ro
  restart: unless-stopped

services:
  api:
    <<: *adpilot
    container_name: adpilot-api
    command: ["python", "main.py"]
    ports:
      - "8300:8300"
    volumes:
      - ./backend/app:/app/app
      - ./backend/main.py:/app/main.py
      - ./deployment:/app/deployment:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro

