# 本机 Docker Compose 开发。不要填 192.168.112.12。
listen_host: "0.0.0.0"
listen_port: 8000

cors_origins:
  - "http://localhost:5173"
  - "http://127.0.0.1:5173"
  - "http://localhost:4173"
  - "http://127.0.0.1:4173"
  - "http://192.168.112.9:5173"
  - "http://192.168.112.9:4173"

postgres:
  host: "postgres"
  port: 5432
  database: "ad_pilot"
  user: "ad_pilot"
  password: "ad_pilot"

redis:
  host: "redis"
  port: 6379
  password: null

api_base: "http://127.0.0.1:8000"
token_ttl_seconds: 86400
uvicorn_workers: 2
db_pool_size: 10
db_pool_max_overflow: 10
db_pool_timeout: 30
